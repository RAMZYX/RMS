name: Deploy Koach preview to GitHub Pages

# Builds BOTH apps and publishes a combined site so nothing is lost:
#   - existing Miqāt PWA at the site root  (https://<owner>.github.io/RMS/)
#   - Koach training-program app at        (https://<owner>.github.io/RMS/koach/)
on:
  push:
    branches:
      - koach-design-trail
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      GITHUB_PAGES: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) Build the existing root PWA -> dist (base /RMS/)
      - run: npm ci
      - run: npm run build

      # 2) Build the Koach app -> koach-app/dist (base /RMS/koach/)
      - run: npm ci
        working-directory: koach-app
      - run: npm run build
        working-directory: koach-app

      # 3) Assemble the combined Pages site
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r dist/* _site/
          mkdir -p _site/koach
          cp -r koach-app/dist/* _site/koach/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
